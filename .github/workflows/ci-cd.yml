name: CI-CD Credit Scoring API

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: Automated tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install libgomp
        run: |
          sudo apt-get update
          sudo apt-get install -y libgomp1

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -v

  build-and-deploy:
    name: Docker build and deployment smoke test
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build -t pret-a-depenser-api:${{ github.sha }} .

      - name: Start API container
        run: |
          docker run -d --name pret-a-depenser-api -p 8001:8000 pret-a-depenser-api:${{ github.sha }}

      - name: Check API health
        run: |
          for i in {1..30}; do
            if curl --fail http://127.0.0.1:8001/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs pret-a-depenser-api
          exit 1

      - name: Check prediction endpoint
        run: |
          curl --fail \
            -X POST \
            -H "Content-Type: application/json" \
            --data-binary @tests/test_payload.json \
            http://127.0.0.1:8001/predict

      - name: Stop API container
        if: always()
        run: docker rm -f pret-a-depenser-api || true